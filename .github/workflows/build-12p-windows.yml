name: Build Warzone 12P Windows Test Client

on:
  push:
    branches: [ "12p-client-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Clone exact Warzone 2100 4.7.0
        shell: powershell
        run: |
          git clone --branch 4.7.0 --depth 1 --recurse-submodules --shallow-submodules https://github.com/Warzone2100/warzone2100.git warzone2100

      - name: Apply 12P engine, netcode and map patch
        shell: powershell
        run: |
          python .\patch-12p.py .\warzone2100
          Select-String -Path .\warzone2100\lib\framework\frame.h -Pattern "MAX_PLAYERS"
          Select-String -Path .\warzone2100\lib\netplay\autorevision_netplay.cmake -Pattern "0x12A0"
          Select-String -Path .\warzone2100\data\mp\addon.lev -Pattern "WaterLoop" -Context 0,4

      - name: Create build directory
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path build | Out-Null

      - name: Build vcpkg dependencies
        shell: powershell
        working-directory: build
        run: |
          $env:CXXFLAGS = "$env:CXXFLAGS /D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR"
          & "..\warzone2100\get-dependencies_win.ps1" -VCPKG_BUILD_TYPE "release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure x64 Release
        shell: powershell
        working-directory: build
        run: |
          $env:CXXFLAGS = "$env:CXXFLAGS /D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR"
          cmake -DCMAKE_TOOLCHAIN_FILE="$pwd\vcpkg\scripts\buildsystems\vcpkg.cmake" -DCPACK_PACKAGE_FILE_NAME:STRING="Warzone2100-12P-Test" -DWZ_DISTRIBUTOR:STRING="12P-TEST" -DENABLE_DISCORD:BOOL=OFF -DWZ_BUILD_SENTRY:BOOL=OFF -DENABLE_GNS_NETWORK_BACKEND:BOOL=ON -G "Visual Studio 17 2022" -A x64 "..\warzone2100"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build client
        shell: powershell
        working-directory: build
        run: |
          $env:CXXFLAGS = "$env:CXXFLAGS /D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR"
          cmake --build . --config Release --target warzone2100 -- /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable Windows ZIP
        shell: powershell
        working-directory: build
        run: |
          cpack -D CPACK_PACKAGE_FILE_NAME="Warzone2100-12P-Test" -D CPACK_INCLUDE_TOPLEVEL_DIRECTORY=OFF -D CPACK_ARCHIVE_COMPONENT_INSTALL=ON -D CPACK_COMPONENTS_ALL_IN_ONE_PACKAGE=ON -G ZIP -C Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path . -Filter "Warzone2100-12P-Test*.zip"

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: Warzone2100-12P-Test-Windows
          path: build/Warzone2100-12P-Test*.zip
          if-no-files-found: error
          retention-days: 7
